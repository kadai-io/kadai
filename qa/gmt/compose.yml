name: 'kadai'

services:

  app:
    container_name: kadai-example-app
    # Default image for tests and regular measurements.
    # The Blauer Engel certification scenario pins a frozen sha tag instead
    # (see usage_scenario_blue_angel.yml).
    image: ghcr.io/kadai-io/kadai-gmt:latest
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://kadai-postgres:5432/postgres
      LOGGING_LEVEL_IO_KADAI: INFO
      GENERATESAMPLEDATA: false
      KADAI_SCHEMA_NAME: kadai
    healthcheck:
      test: "curl --fail --silent http://localhost:8080/kadai/actuator/health"
      start_period: "30s"
      start_interval: "1s"
      interval: "24h" # only the start is relevant for us
      timeout: "1s"

  postgres:
    container_name: kadai-postgres
    image: postgres:17.11
    restart: always
    shm_size: 128mb # default: 64 MB
    ports:
      - "5102:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    healthcheck:
      test: "pg_isready -h localhost -p 5432 -U postgres"
      start_period: "20s"
      start_interval: "1s"
      interval: "24h" # only the start is relevant for us
      timeout: "1s"

  k6:
    container_name: k6
    image: grafana/k6:2.3.0
    depends_on:
      app:
        condition: service_healthy # wait until the service is ready before starting with the flow
    entrypoint: "" # ignore default entrypoint
    command: sleep infinity # wait for commands in the flow
    environment:
      TARGET_HOSTNAME: "kadai-example-app"
      TARGET_PORT: "8080"
      K6_NO_USAGE_REPORT: "true" # disables k6 usage reporting (creates multiple connections to a Google server)
      SEED_TASKS: "100000" # number of tasks generated by the GMT test-data endpoint before the flow; override per scenario
