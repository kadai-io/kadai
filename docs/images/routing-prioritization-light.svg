<text x="852" y="186" text-anchor="middle" class="m" style="font-size:12px">works on the</text>
<text x="852" y="202" text-anchor="middle" class="m" style="font-size:12px">most urgent</text>
<text x="852" y="218" text-anchor="middle" class="m" style="font-size:12px">task first</text>
<text x="612" y="448" class="m" style="font-size:12px">Priority</text>
