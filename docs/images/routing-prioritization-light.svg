<text x="330" y="68" class="t" style="font-size:20px;font-weight:800" letter-spacing="2">KADAI</text>
<rect x="290" y="96" width="250" height="96" rx="12" class="card"/>
<circle cx="314" cy="122" r="12" class="mint-solid"/>
<text x="314" y="127" text-anchor="middle" class="on-mint" style="font-size:13px;font-weight:800">1</text>
<text x="336" y="127" class="t" style="font-size:15px;font-weight:700">Classify</text>
<text x="306" y="154" class="m" style="font-size:12px">Service level &amp; priority are</text>
<text x="306" y="171" class="m" style="font-size:12px">derived from the classification</text>
<rect x="290" y="208" width="250" height="96" rx="12" class="card"/>
<circle cx="314" cy="234" r="12" class="mint-solid"/>
<text x="314" y="239" text-anchor="middle" class="on-mint" style="font-size:13px;font-weight:800">2</text>
<text x="336" y="239" class="t" style="font-size:15px;font-weight:700">Route</text>
<text x="306" y="266" class="m" style="font-size:12px">Finds the right workbasket, e.g.</text>
<text x="306" y="283" class="m" style="font-size:12px">via DMN decision tables</text>
<rect x="290" y="320" width="250" height="96" rx="12" class="card"/>
<circle cx="314" cy="346" r="12" class="mint-solid"/>
<text x="314" y="351" text-anchor="middle" class="on-mint" style="font-size:13px;font-weight:800">3</text>
<text x="336" y="351" class="t" style="font-size:15px;font-weight:700">Prioritize</text>
<text x="306" y="378" class="m" style="font-size:12px">Custom rules and a scheduled job</text>
<text x="306" y="395" class="m" style="font-size:12px">keep priorities up to date</text>
<rect x="430" y="339" width="20" height="14" rx="4" class="f-rose"/>
<rect x="456" y="339" width="20" height="14" rx="4" class="f-rose"/>
<rect x="482" y="339" width="20" height="14" rx="4" class="f-amber"/>
<rect x="508" y="339" width="20" height="14" rx="4" class="f-green"/>
<text x="612" y="40" class="cap">WORKBASKETS</text>
