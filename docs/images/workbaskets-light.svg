<svg xmlns="http://www.w3.org/2000/svg" width="900" height="404" viewBox="0 0 900 404" role="img" aria-labelledby="title desc">
  <title id="title">KADAI workbaskets</title>
  <desc id="desc">Topic, group and personal workbaskets connected by distribution targets; a task is distributed from a topic workbasket to a team, then to a person, then transferred to a colleague.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .t { fill: #1f2328; }
    .m { fill: #59636e; }
    .cap { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; fill: #59636e; }
    .lbl { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; fill: #59636e; }
    .lbl-mint { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; fill: #116149; font-weight: 600; }
    .lbl-rose { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; fill: #cf222e; }
    .lbl-amber { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; fill: #9a6700; }
    .card { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1.2; }
    .card-dashed { fill: #ffffff; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .zone { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.2; }
    .zone-dashed { fill: none; stroke: #d1d9e0; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .zone-mint { fill: #e6f5f0; stroke: #84c8b4; stroke-width: 1.2; }
    .mint { fill: #e6f5f0; stroke: #84c8b4; stroke-width: 1.4; }
    .mint-solid { fill: #84c8b4; }
    .blue { fill: #ddf4ff; stroke: #80ccff; stroke-width: 1.4; }
    .green { fill: #dafbe1; stroke: #4ac26b; stroke-width: 1.4; }
    .amber { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.4; }
    .rose { fill: #ffebe9; stroke: #ff8182; stroke-width: 1.4; }
    .t-mint { fill: #116149; }
    .t-blue { fill: #0969da; }
    .t-green { fill: #1a7f37; }
    .t-amber { fill: #9a6700; }
    .t-rose { fill: #cf222e; }
    .f-text { fill: #1f2328; }
    .f-muted { fill: #59636e; }
    .f-line { fill: #8c959f; }
    .f-mint { fill: #2f9c7e; }
    .f-green { fill: #4ac26b; }
    .f-amber { fill: #d4a72c; }
    .f-rose { fill: #ff8182; }
    .f-blue { fill: #80ccff; }
    .e { fill: none; stroke: #8c959f; stroke-width: 1.5; }
    .e-dash { fill: none; stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .e-mint { fill: none; stroke: #2f9c7e; stroke-width: 2.2; }
    .e-rose { fill: none; stroke: #ff8182; stroke-width: 1.6; }
    .e-amber { fill: none; stroke: #d4a72c; stroke-width: 1.6; }
    .e-green { fill: none; stroke: #4ac26b; stroke-width: 1.8; }
    .on-mint { fill: #0d1117; }
    .logo-mint { fill: #84c8b4; }
    .logo-bar { fill: #1f1f1f; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-line"/></marker>
    <marker id="ah-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-mint"/></marker>
    <marker id="ah-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-rose"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-amber"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-green"/></marker>
