<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">KADAI architecture</title>
  <desc id="desc">KADAI Web (Workplace, Admin, Monitor) talks to the REST API, which uses the KADAI Java library with its SPI plugins on top of an H2, PostgreSQL or Db2 database. Custom clients use the REST API or the library; an adapter connects Camunda and other systems.</desc>
  <style>
