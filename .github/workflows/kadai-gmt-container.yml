name: Build and publish KADAI GMT container

on:
  push:
    branches:
      - master
      # Certification branches get their own image, tagged after the branch name
      # (e.g. branch blauer-engel/v12.1.0 -> tag blauer-engel-v12.1.0).
      - "blauer-engel/**"
    paths:
      - ".github/workflows/kadai-gmt-container.yml"
      - "rest/kadai-gmt/**"
      - "rest/kadai-rest-spring/**"
      - "rest/kadai-rest-spring-example-common/**"
      - "common/**"
      - "lib/**"
      - "pom.xml"
      - "rest/pom.xml"
      - "qa/checkstyle/checkstyle.xml"
      - "mvnw"
      - ".mvn/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/kadai-gmt

jobs:
  build-test-publish:
    name: Build, test, and publish image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # sha-<commit> always, <branch> for every branch build, latest only from the
      # default branch so that certification branches cannot replace it.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: rest/kadai-gmt/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=kadai-gmt
          cache-to: type=gha,mode=max,scope=kadai-gmt

      - name: Run image with H2
        run: |
          docker run --detach --rm --name kadai-gmt --publish 9000:9000 \
            --env 'SPRING_DATASOURCE_URL=jdbc:h2:mem:kadai;NON_KEYWORDS=KEY,VALUE;IGNORECASE=TRUE;DB_CLOSE_ON_EXIT=FALSE;LOCK_MODE=0' \
            --env SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.h2.Driver \
            --env SPRING_DATASOURCE_USERNAME=sa \
            --env SPRING_DATASOURCE_PASSWORD= \
            --env KADAI_SCHEMA_NAME=KADAI \
            --env MANAGEMENT_HEALTH_LDAP_ENABLED=false \
            "${IMAGE_NAME}:sha-${GITHUB_SHA}"

      - name: Verify health endpoint
        run: |
          timeout 120 bash -c \
            'until curl --fail --silent --show-error http://localhost:9000/actuator/health; do sleep 2; done'

      - name: Show container logs
        if: always()
        run: docker logs kadai-gmt

      - name: Stop container
        if: always()
        run: docker stop kadai-gmt || true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        run: |
          while read -r tag; do docker push "$tag"; done <<< "${{ steps.meta.outputs.tags }}"

  bump-scenario-pin:
    name: Bump pinned image in regular GMT scenario
    needs: build-test-publish
    # Only the regular scenario follows master; certification branches are pinned manually.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Open PR bumping the pinned image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ci/bump_gmt_pin.sh qa/gmt/usage_scenario_standard.yml
