name: Build and publish KADAI GMT container

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/kadai-gmt-container.yml"
      - "rest/kadai-gmt/**"
      - "rest/kadai-rest-spring/**"
      - "rest/kadai-rest-spring-example-common/**"
      - "common/**"
      - "lib/**"
      - "pom.xml"
      - "rest/pom.xml"
      - "qa/checkstyle/checkstyle.xml"
      - "mvnw"
      - ".mvn/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/kadai-gmt

jobs:
  build-test-publish:
    name: Build, test, and publish image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: rest/kadai-gmt/Dockerfile
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=kadai-gmt
          cache-to: type=gha,mode=max,scope=kadai-gmt

      - name: Run image with H2
        run: |
          docker run --detach --rm --name kadai-gmt --publish 8080:8080 \
            --env 'SPRING_DATASOURCE_URL=jdbc:h2:mem:kadai;NON_KEYWORDS=KEY,VALUE;IGNORECASE=TRUE;DB_CLOSE_ON_EXIT=FALSE;LOCK_MODE=0' \
            --env SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.h2.Driver \
            --env SPRING_DATASOURCE_USERNAME=sa \
            --env SPRING_DATASOURCE_PASSWORD= \
            --env KADAI_SCHEMA_NAME=KADAI \
            --env MANAGEMENT_HEALTH_LDAP_ENABLED=false \
            "${IMAGE_NAME}:latest"

      - name: Verify health endpoint
        run: |
          timeout 120 bash -c \
            'until curl --fail --silent --show-error http://localhost:8080/kadai/actuator/health; do sleep 2; done'

      - name: Show container logs
        if: always()
        run: docker logs kadai-gmt

      - name: Stop container
        if: always()
        run: docker stop kadai-gmt || true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        run: |
          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:sha-${GITHUB_SHA}"

  bump-scenario-pin:
    name: Bump pinned image in regular GMT scenario
    needs: build-test-publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Bump pinned image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Rebuild the commit on current master and retry, so a concurrent push to
          # master during the build does not leave the pin stale.
          for _ in 1 2 3; do
            git fetch origin master
            git reset --hard origin/master
            sed -i -E "s#(${IMAGE_NAME}:sha-)[0-9a-f]+#\1${GITHUB_SHA}#" qa/gmt/usage_scenario_standard.yml
            git add qa/gmt/usage_scenario_standard.yml
            if git diff --cached --quiet; then
              echo "Pinned image is already up to date."
              exit 0
            fi
            git commit -m "Bump pinned kadai-gmt image for regular GMT measurements"
            if git push; then
              exit 0
            fi
            sleep 5
          done
          echo "Failed to push image-pin bump after retries." >&2
          exit 1
