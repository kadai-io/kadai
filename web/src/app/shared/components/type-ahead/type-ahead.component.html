<div [ngClass]="size() === 'compact' ? 'type-ahead--small' : 'type-ahead--large'">
  <mat-form-field appearance="outline" class="type-ahead__form-field">
    <mat-label class="type-ahead__label" matTooltip="{{ name() }}" matTooltipPosition="above">
      {{ name() || placeholder() }}
    </mat-label>
    <!-- TEXT INPUT -->
    <input (blur)="onBlur()"
           [errorStateMatcher]="errorStateMatcher"
           [formControl]="inputControl"
           [matAutocomplete]="auto"
           [required]="required()"
           class="type-ahead__input-field"
           matInput
           matTooltip="{{ inputControl.value }}"
           placeholder="{{ placeholder() }}"
           type="text">
    <!-- ERROR MESSAGE -->
    @if (hasError()) {
      <mat-error
        [ngClass]="size() === 'compact' ? 'type-ahead__error--accessId' : 'type-ahead__error--general'">
        {{ errorMessage() }}
      </mat-error>
    }
    <!-- AUTOCOMPLETE LIST -->
    <mat-autocomplete #auto (optionSelected)="onOptionSelected($event)">
      @for (accessId of filteredAccessIds(); track accessId) {
        <mat-option [value]="accessId.accessId"
                    class="type-ahead__form-options"
                    matTooltip="{{accessId.accessId}} {{accessId.name}}"
                    [matTooltipPosition]="matTooltipPosition()">
          <small>{{ accessId.accessId }}&nbsp;&nbsp;{{ accessId.name }}</small>
        </mat-option>
      }
    </mat-autocomplete>
  </mat-form-field>
</div>
